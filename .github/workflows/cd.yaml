name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: read

defaults:
  run:
    shell: bash

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: [self-hosted, lab-app]
    concurrency:
      group: deploy-app
      cancel-in-progress: false
    timeout-minutes: 10
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Check that the commit is still current
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head_sha=$(curl -fsS --max-time 15 -H @- "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/ref/heads/main" \
            <<< "Authorization: Bearer $GH_TOKEN" | jq -er .object.sha)
          if [[ "$head_sha" == "$DEPLOY_SHA" ]]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipping $DEPLOY_SHA because main is now $head_sha"
          fi
      - uses: actions/checkout@v7.0.1
        if: steps.commit.outputs.current == 'true'
        with:
          ref: ${{ env.DEPLOY_SHA }}
          persist-credentials: false
      - uses: docker/login-action@v4.6.0
        if: steps.commit.outputs.current == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Deploy app and Traefik
        if: steps.commit.outputs.current == 'true'
        run: |
          export IMAGE_PREFIX="ghcr.io/${GITHUB_REPOSITORY,,}"
          export IMAGE_TAG="$DEPLOY_SHA"
          docker compose -f deploy/compose.app.yaml pull
          docker compose -f deploy/compose.app.yaml up -d --wait --wait-timeout 120
      - name: Smoke-test the deployed commit
        if: steps.commit.outputs.current == 'true'
        run: |
          curl -fsS --retry 10 --retry-all-errors --retry-delay 2 --max-time 5 http://127.0.0.1/version \
            | jq -e --arg sha "$DEPLOY_SHA" '.git_sha == $sha and .image_tag == $sha'
          curl -fsS --max-time 5 http://127.0.0.1/predict -H 'Content-Type: application/json' \
            -d '{"pickup_zone_id":132,"dropoff_zone_id":230,"pickup_datetime":"2024-03-08T17:05:00"}' \
            | jq -e '.duration_minutes == 12.25 and .model.name == "static-median"'
          status=$(curl -sS --max-time 5 -o /dev/null -w '%{http_code}' \
            http://127.0.0.1/predict -H 'Content-Type: application/json' \
            -d '{"pickup_zone_id":999,"dropoff_zone_id":230,"pickup_datetime":"2024-03-08T17:05:00"}')
          [[ "$status" == 422 ]]
