name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: read

defaults:
  run:
    shell: bash

jobs:
  stage:
    if: >-
      vars.LAB_SERVING == 'on' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: [self-hosted, lab-app]
    concurrency:
      group: deploy-app
      cancel-in-progress: false
    timeout-minutes: 10
    outputs:
      colour: ${{ steps.staged.outputs.colour }}
      sha: ${{ steps.staged.outputs.sha }}
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
      LLM_HOST: ${{ vars.LLM_HOST }}
    steps:
      - name: Check that the commit is still current
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head_sha=$(curl -fsS --max-time 15 -H @- "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/ref/heads/main" \
            <<< "Authorization: Bearer $GH_TOKEN" | jq -er .object.sha)
          if [[ "$head_sha" == "$DEPLOY_SHA" ]]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipping $DEPLOY_SHA because main is now $head_sha"
          fi
      - uses: actions/checkout@v7.0.1
        if: steps.commit.outputs.current == 'true'
        with:
          ref: ${{ env.DEPLOY_SHA }}
          persist-credentials: false
      - uses: docker/login-action@v4.6.0
        if: steps.commit.outputs.current == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Stage and smoke-test the idle colour
        id: staged
        if: steps.commit.outputs.current == 'true'
        run: |
          export IMAGE_PREFIX="ghcr.io/${GITHUB_REPOSITORY,,}"
          live=$(deploy/web.sh live)
          if [[ "$live" != none ]] && [[ "$(deploy/web.sh tag "$live")" == "$DEPLOY_SHA" ]]; then
            echo "$DEPLOY_SHA is already live."
            exit 0
          fi
          deploy/blue-green.sh stage "$DEPLOY_SHA"
          live=$(deploy/web.sh live)
          idle=blue
          [[ "$live" != blue ]] || idle=green
          echo "colour=$idle" >> "$GITHUB_OUTPUT"
          echo "sha=$DEPLOY_SHA" >> "$GITHUB_OUTPUT"
          printf '### App traffic approval\n\nSmoke-tested **%s** on **%s**.\n' "$DEPLOY_SHA" "$idle" >> "$GITHUB_STEP_SUMMARY"

  switch:
    needs: stage
    if: >-
      needs.stage.outputs.colour != '' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'main'
    environment: app-production
    runs-on: [self-hosted, lab-app]
    concurrency:
      group: deploy-app
      cancel-in-progress: false
    timeout-minutes: 5
    env:
      DEPLOY_SHA: ${{ needs.stage.outputs.sha }}
      COLOUR: ${{ needs.stage.outputs.colour }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.DEPLOY_SHA }}
          persist-credentials: false
      - name: Switch app traffic to the approved build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head_sha=$(curl -fsS --max-time 15 -H @- "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/ref/heads/main" \
            <<< "Authorization: Bearer $GH_TOKEN" | jq -er .object.sha)
          if [[ "$head_sha" != "$DEPLOY_SHA" ]]; then
            echo "main advanced while this build waited for approval. Review the newer deploy." >&2
            exit 1
          fi
          deploy/blue-green.sh switch "$COLOUR" "$DEPLOY_SHA" | tee -a "$GITHUB_STEP_SUMMARY"
